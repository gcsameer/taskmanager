{% extends 'base.html' %}
{% block content %}

<h3 class="mb-4">
    {% if task %}Edit Task{% else %}Add New Task{% endif %}
</h3>

<div class="card shadow-sm p-4">
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" value="{{ task.title|default:'' }}" 
               class="form-control mb-3" placeholder="Task name" required>
        <button class="btn btn-primary">Save</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
